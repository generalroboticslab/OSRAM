[project]
name = "training"
version = "0.1.0"
description = "Online dynamics model finetuning for MuJoCo robot policies"
readme = "README.md"
authors = [
    { name = "Yuhao Zhang", email = "huangyuhaowork@outlook.com" }
]
requires-python = ">=3.12,<3.14"
keywords = ["robotics", "dynamics-modeling", "reinforcement-learning", "mujoco"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mjlab==1.3.0",
    "jax==0.8.0",
    "flax==0.12.0",
    "optax==0.2.6",
    "torch==2.9.0",
    "tensordict==0.10.0",
    "wandb==0.22.3",
    "matplotlib==3.10.7",
    "numpy==2.3.4",
    "tqdm==4.67.1",
    "interpax==0.3.12",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]==0.8.0"]

[project.urls]
Repository = "https://github.com/generalroboticslab/OSRAM/tree/main/training"
Issues = "https://github.com/generalroboticslab/OSRAM/issues"

[project.scripts]
list-envs = "training.scripts.list_envs:main"
policy-train = "training.scripts.train:main"
policy-play = "training.scripts.play:main"
policy-explore = "training.scripts.explore:main"
dynamics-train = "training.scripts.dynamics_train:main"
plot = "training.scripts.plot:main"
create-dataset = "training.scripts.data:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
src = ["src", "tests"]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[project.entry-points."mjlab.tasks"]
    all_tasks = "training.tasks"

[dependency-groups]
dev = [
    "build==1.3.0",
    "cffconvert==2.0.0",
    "pytest==9.0.3",
    "ruff==0.14.14",
]
