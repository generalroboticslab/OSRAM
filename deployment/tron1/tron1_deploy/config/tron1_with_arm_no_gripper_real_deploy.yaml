# Controller Manager configuration for real Tron1 with arm and no gripper
controller_manager:
  ros__parameters:
    update_rate: 500
    tron1_iekf_estimator:
      type: tron1_deploy/Tron1IEKFEstimator
    tron1_velocity_planner:
      type: tron1_deploy/Tron1VelocityPlanner
    tron1_edamp_controller:
      type: humanoid_controllers/HumanoidPassthroughController
    tron1_squatting_controller:
      type: humanoid_controllers/HumanoidPassthroughController
    tron1_standing_controller:
      type: tron1_deploy/Tron1LocoManipulationNoGripperStandingPolicy
    tron1_with_arm_planner:
      type: tron1_deploy/Tron1WithArmPlanner
    tron1_loco_manipulation:
      type: tron1_deploy/Tron1LocoManipulationNoGripper
tron1_iekf_estimator:
  ros__parameters:
    package_name: tron1_description
    urdf_path: urdf/tron1_with_arm_flat_foot_no_gripper.urdf
    p_init_std:
    - 0.001
    - 0.001
    - 0.001
    v_init_std:
    - 0.001
    - 0.001
    - 0.001
    foot_init_std: 0.001
    orientation_init_std: 0.001
    accel_bias_init_std: 1.0e-06
    angular_bias_init_std: 1.0e-06
    p_process_std:
    - 0.001
    - 0.001
    - 0.001
    accel_input_std:
    - 0.08
    - 0.08
    - 0.08
    gyro_input_std:
    - 0.02
    - 0.02
    - 0.02
    accel_bias_process_std:
    - 0.001
    - 0.001
    - 0.001
    angular_bias_process_std:
    - 1.0e-05
    - 1.0e-05
    - 1.0e-05
    num_legs: 2
    dim_legs: 4
    contact_names:
    - foot_L_Link
    - foot_R_Link
    using_mob: 1
    using_lo_p: 1
    using_lo_v: 0
    joint_position_std:
    - 0.05
    - 0.05
    - 0.05
    - 0.05
    joint_velocity_std:
    - 0.2
    - 0.2
    - 0.2
    - 0.2
    foot_slide_std:
    - 0.05
    - 0.05
    - 0.05
    foot_swing_std:
    - 1000.0
    - 1000.0
    - 1000.0
    contact_effort_threshold: 12.0
    q_body_imu:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
    p_body_imu:
    - 0.0
    - 0.0
    - 0.0
    visualize: 0
    rate: 500
    N: 1
    joint_names:
    - abad_L_Joint
    - hip_L_Joint
    - knee_L_Joint
    - ankle_L_Joint
    - abad_R_Joint
    - hip_R_Joint
    - knee_R_Joint
    - ankle_R_Joint
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    foot_names:
    - foot_L
    - foot_R
    foot_sensor_names:
    - state
    - force_x
    - force_y
    - force_z
    - torque_x
    - torque_y
    - torque_z
    use_vicon_pos: true
    # true defines world axes clockwise 90 deg from Vicon:
    # x_world=-y_vicon, y_world=x_vicon.
    # rotate_vicon_world_frame_clockwise_90: false
    node_name: "tron1_iekf_estimator_sub"
    tracker_name: "grl_tron1_arm"
    debug: true
tron1_velocity_planner:
  ros__parameters:
    sampling_frequency: 50.0
    damping_frequency: 1.0
    damping_intensity: 0.0
    max_linear_velocity_x: 1.5
    max_linear_velocity_y: 1.5
    max_angular_velocity_yaw: 1.0
    constant_linear_velocity_x: 0.0
    constant_linear_velocity_y: 0.4
    constant_angular_velocity_yaw: 0.0
    velocity_x_button: 3
    velocity_y_button: 2
    yaw_rate_button: 1
    mode_button: 4
