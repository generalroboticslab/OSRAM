tron1_iekf_estimator:
  ros__parameters:
    package_name: "tron1_description"
    urdf_path: "urdf/tron1_flat_foot.urdf"
    # prior_noise
    p_init_std: [0.001, 0.001, 0.001]
    v_init_std: [0.001, 0.001, 0.001]
    foot_init_std: 0.001
    orientation_init_std: 0.001
    accel_bias_init_std: 0.000001
    angular_bias_init_std: 0.000001
    # process_noise
    p_process_std: [0.001, 0.001, 0.001]
    accel_input_std: [0.08, 0.08, 0.08] # [0.04, 0.04, 0.04]
    gyro_input_std: [0.04, 0.04, 0.04] # [0.02, 0.02, 0.02]
    accel_bias_process_std: [0.001, 0.001, 0.001]
    angular_bias_process_std: [0.00001, 0.00001, 0.00001]
    # contact_noise
    num_legs: 2
    dim_legs: 4
    contact_names: ["foot_L_Link", "foot_R_Link"]
    # contact_names: ["ankle_L_Link", "ankle_R_Link"]
    using_mob: 1
    using_lo_p: 1
    using_lo_v: 0
    joint_position_std: [0.05, 0.05, 0.05, 0.05] # [0.05, 0.05, 0.05, 0.05]
    joint_velocity_std: [0.2, 0.2, 0.2, 0.2]
    foot_slide_std: [0.12, 0.12, 0.12] # [0.0001, 0.0001, 0.0001]
    foot_swing_std: [1000.0, 1000.0, 1000.0]
    contact_effort_threshold: 25.0 # 12.0
    # body_imu calibration
    q_body_imu: [1.0, 0.0, 0.0, 0.0] # [w, x, y, z]
    p_body_imu: [0.0, 0.0, 0.0]
    visualize: 0
    # params
    rate: 500
    N: 1
    # joint order
    joint_names:
      - "abad_L_Joint"
      - "hip_L_Joint"
      - "knee_L_Joint"
      - "ankle_L_Joint"
      - "abad_R_Joint"
      - "hip_R_Joint"
      - "knee_R_Joint"
      - "ankle_R_Joint"
    foot_names:
      - "foot_L"
      - "foot_R"
    foot_sensor_names:
      - "state"
      - "force_x"
      - "force_y"
      - "force_z"
      - "torque_x"
      - "torque_y"
      - "torque_z"
    use_vicon_pos: true
    node_name: "tron1_iekf_estimator_sub"
    tracker_name: "grl_tron1"
    debug: true

tron1_velocity_planner:
  ros__parameters:
    sampling_frequency: 50.0  # Hz
    damping_frequency: 1.0
    damping_intensity: 0.0
    max_linear_velocity_x: 1.5  # m/s
    max_linear_velocity_y: 1.5  # m/s
    max_angular_velocity_yaw: 1.0  # rad/s
    constant_linear_velocity_x: 0.7  # m/s
    constant_linear_velocity_y: 0.0  # m/s
    constant_angular_velocity_yaw: 0.0  # rad/s
    velocity_x_button: 3
    velocity_y_button: 2
    yaw_rate_button: 1
    mode_button: 4

tron1_mppi_planner:
  ros__parameters:
    update_rate: 50
    node_name: "tron1_mppi_planner_node"
    dt: 0.02
    horizon: 8
    subscribe_topic_name: "tron1/mppi_command"
    publish_topic_name: "tron1/mppi_obs"
    estimator_name: "tron1_iekf_estimator"
    ref_planner_name: "tron1_velocity_planner"
    sampling_frequency: [50.0, 50.0, 50.0]  # Hz
    damping_frequency: [5.0, 3.0, 0.5]
    damping_intensity: [0.0, 0.0, 0.0]

