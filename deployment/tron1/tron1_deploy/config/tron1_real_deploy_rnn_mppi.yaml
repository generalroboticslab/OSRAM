# Controller Manager configuration
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    tron1_iekf_estimator:
      type: tron1_deploy/Tron1IEKFEstimator

    tron1_velocity_planner:
      type: tron1_deploy/Tron1VelocityPlanner

    tron1_mppi_planner:
      type: tron1_deploy/Tron1MPPIPlanner

    tron1_edamp_controller:
      type: humanoid_controllers/HumanoidPassthroughController

    tron1_squatting_controller:
      type: humanoid_controllers/HumanoidPassthroughController

    tron1_standing_controller:
      type: tron1_deploy/Tron1StandingPolicy

    tron1_velocity_policy:
      type: tron1_deploy/Tron1Velocity

