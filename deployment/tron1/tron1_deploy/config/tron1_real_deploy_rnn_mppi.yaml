tron1_velocity_policy:
  ros__parameters:
    # RNN velocity policy with closed-loop MPPI reference optimization
    update_rate: 50  # Hz
    policy_type: "rnn"  # "base", "rnn", "residual"
    steer_type: "none"  # "none", "closed", "open_full", "open_ref"
    history_length: 3 # 3
    residual_history_length: 3
    hidden_dim: 256
    hidden_layers: 2
    # policy_path: "model/velocity_policy.onnx"
    policy_path: "model/velocity_policy_gru.onnx"
    base_policy_path: "model/velocity_policy.onnx"
    residual_policy_path: "model/velocity_policy_residual.onnx"
    horizon: 8
    dt: 0.02
    node_name: "tron1_velocity_policy_mppi_node"
    subscribe_topic_name: "tron1/mppi_command"
    publish_topic_name: "tron1/mppi_obs"
    sampling_frequency: [50.0]
    damping_frequency: [1.0]
    damping_intensity: [0.0]
    joint_names:
